name: Update VolkovVPN

on:
  schedule:
    # Каждые 5 минут
    - cron: "*/5 * * * *"

  # Можно запустить вручную
  workflow_dispatch:

jobs:

  update:

    runs-on: ubuntu-latest

    # Не даём двум проверкам работать одновременно
    concurrency:
      group: volkovvpn-update
      cancel-in-progress: true

    permissions:
      contents: write

    steps:

      # ==============================
      # Получаем репозиторий
      # ==============================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # Python
      # ==============================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==============================
      # Requests
      # ==============================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==============================
      # Обновление
      # ==============================

      - name: Update and check servers
        run: |
          python update.py

      # ==============================
      # Сохраняем результат
      # ==============================

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add unified.txt

          if git diff --staged --quiet; then

            echo "Изменений нет."

          else

            git commit \
              -m "Update VolkovVPN configs"

            git push

          fi
