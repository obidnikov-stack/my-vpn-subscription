name: Update VolkovVPN

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:

  update:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    concurrency:
      group: volkovvpn-update
      cancel-in-progress: true

    permissions:
      contents: write

    steps:

      # ==========================================
      # Репозиторий
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # Зависимости
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==========================================
      # Установка sing-box 1.14.0
      # ==========================================

      - name: Install sing-box
        run: |

          VERSION="1.14.0"

          wget -q \
            "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz" \
            -O sing-box.tar.gz

          tar -xzf sing-box.tar.gz

          SING_DIR=$(find . -maxdepth 1 -type d -name "sing-box-*")

          cp "$SING_DIR/sing-box" ./sing-box

          chmod +x ./sing-box

          ./sing-box version

      # ==========================================
      # Обновление
      # ==========================================

      - name: Update and check VPN servers
        run: |
          python update.py

      # ==========================================
      # Сохраняем результат
      # ==========================================

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add unified.txt

          if git diff --staged --quiet; then

            echo "Изменений нет."

          else

            git commit \
              -m "Update VolkovVPN configs"

            git push

          fi
